# =============================================================================
# igadit.conf — iGADit Configuration File
# IT 123: System Administration and Maintenance | Option 1A
#
# IMPORTANT:
#   This file contains sensitive environment configuration.
#   On the Ubuntu VM, set permissions to 600 (owner read/write only):
#     sudo mkdir -p /etc/igadit
#     sudo cp igadit.conf /etc/igadit/igadit.conf
#     sudo chown root:root /etc/igadit/igadit.conf
#     sudo chmod 600 /etc/igadit/igadit.conf
#
# DO NOT hardcode real production passwords in Git repositories.
# Replace <CHANGEME> on your deployed VM.
# =============================================================================

# --- Application Paths & Source ---
APP_NAME="igadit"
APP_DIR="/var/www/html/igadit"
REPO_URL="https://github.com/ainjelly/iGADit.git"
PHP_VER="8.2"

# --- Database Credentials (Local VM) ---
DB_NAME="igadit"
DB_USER="igadit_user"
DB_PASS="<CHANGEME_DB_PASSWORD>"
DB_HOST="127.0.0.1"
DB_PORT="3306"

# --- Backup Locations ---
BACKUP_ROOT="/var/backups/igadit"

# --- Monitoring & Disk Alerts ---
DISK_THRESHOLD=80
ALERT_LOG="/var/log/igadit-disk-alert.log"
REPORT_DIR="/var/log/igadit-reports"
